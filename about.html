<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="HandheldFriendly" content="true" />
  <meta name="MobileOptimized" content="320" />
  <link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&amp;subset=latin,latin-ext,cyrillic'
    rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/header-nav.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <title>adty</title>
  <link rel="icon" type="image/x-icon" href="img/Logo saya.png">
</head>

<body>

  <!-- Header -->
  <div id="site-header"></div>
  <!-- End Header -->

  <!-- About Image -->
  <section id="single-team" class="container">
    <div class="row">
      <div class="span12">
        <div class="team-img">
          <img id="about-image" src="" alt="About">
        </div>
      </div>
    </div>
  </section>

  <br />

  <!-- Intro / Bio -->
  <section id="intro-box" class="margin-0">
    <div class="container">
      <div class="row">
        <div class="span12">
          <h3 id="about-bio" class="center"></h3>
        </div>
      </div>
    </div>
  </section>
  <!-- End Intro Box -->

  <!-- Services -->
  <section id="about-services" class="container">
    <div class="row">
      <div class="span4">
        <div class="team-name">
          <p>Services</p>
        </div>
      </div>
      <div class="span4">
        <div class="team-name" id="services-col-1"></div>
      </div>
      <div class="span4">
        <div class="team-name" id="services-col-2"></div>
      </div>
    </div>
  </section>
  <!-- End Services -->

  <br />
  <br />

  <!-- Experiences -->
  <section id="about-experience" class="container">
    <div class="row">
      <div class="span4">
        <div class="team-description">
          <br />
          <p>Experience</p>
        </div>
      </div>
      <div class="span4">
        <div class="team-name" id="experience-col-1">
          <br />
        </div>
      </div>
      <div class="span4">
        <div class="team-name" id="experience-col-2">
          <br />
        </div>
      </div>
    </div>
  </section>
  <!-- End Experiences -->

  <br />
  <br />
  <br />

  <!-- Footer -->
  <div id="site-footer"></div>
  <!-- End Footer -->

  <script src="js/include.js"></script>
  <script src="js/nav-toggle.js"></script>

  <!-- Data & render about (urutan penting: data dulu baru render) -->
  <script src="js/about-data.js"></script>
  <script src="js/render-about.js"></script>
</body>

</html>
