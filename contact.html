<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="320" />
    <link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&amp;subset=latin,latin-ext,cyrillic'
        rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/header-nav.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>adty</title>
    <link rel="icon" type="image/x-icon" href="img/Logo saya.png">
</head>

<body>

    <!-- Header -->
    <div id="site-header"></div>
    <!-- End Header -->

    <!-- Contact Image -->
    <section id="single-team" class="container">
        <div class="row">
            <div class="span12">
                <div class="team-img">
                    <img id="contact-image" src="" alt="Contacts">
                </div>
            </div>
        </div>
    </section>

    <br />

    <!-- Start Intro Box -->
    <section id="intro-box" class="margin-0">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <h3 id="contact-heading" class="center"></h3>
                </div>
            </div>
        </div>
    </section>
    <!-- End Intro Box -->

    <!-- Contact Details -->
    <section id="contact-details" class="container">
        <div class="row">
            <div class="span6">
                <h3 id="contact-phone"></h3>
                <h6>call me</h6>
            </div>
            <div class="span6">
                <h3 id="contact-email"></h3>
                <h6>write to me</h6>

                <br />
                <br />
                <br />
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="site-footer"></div>
    <!-- End Footer -->

    <script src="js/include.js"></script>
    <script src="js/nav-toggle.js"></script>

    <!-- Data & render contact (urutan penting: data dulu baru render) -->
    <script src="js/contact-data.js"></script>
    <script src="js/render-contact.js"></script>
</body>

</html>
